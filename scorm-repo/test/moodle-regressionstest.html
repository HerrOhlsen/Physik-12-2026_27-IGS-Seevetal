<!DOCTYPE html>
<html lang="de">
<head><meta charset="utf-8"><title>Moodle-Regressionstest fuer SCORM-Module</title>
<style>
 body{margin:0;font-family:sans-serif;background:#f5f5f5}
 .kopf{background:#0f6cbf;color:#fff;padding:12px 20px}
 .fuss{padding:40px 20px;color:#666}
 iframe{width:100%;border:0;display:block;background:#0b1220}
</style>
</head>
<body>
<div class="kopf">Moodle-Nachbau &middot; <span id="modulname"></span></div>
<iframe id="sco" scrolling="no"></iframe>
<div class="fuss">
  <button onclick="runTests()" style="padding:8px 16px;font-size:15px;cursor:pointer">Tests ausfuehren</button>
  <div id="ergebnis" style="margin-top:1rem"></div>
</div>
<script>
// Zu pruefendes Modul: ?modul=../src/PH12S1Messen/index.html
const MODUL = new URLSearchParams(location.search).get('modul') || '../src/PH12S1Messen/index.html';
document.getElementById('sco').src = MODUL;
document.getElementById('modulname').textContent = MODUL;

// --- SCORM-1.2-Mock mit den Grenzen, die Moodle durchsetzt ---
window.SCORM_LOG = [];
window.API = (function () {
  const store = {}; let err = '0';
  const LIMITS = { 'cmi.core.lesson_location': 255, 'cmi.suspend_data': 4096 };
  return {
    LMSInitialize: function () { err='0'; return 'true'; },
    LMSGetValue: function (el) { err='0'; return store[el] || ''; },
    LMSSetValue: function (el, val) {
      const max = LIMITS[el], s = String(val);
      if (max && s.length > max) { err='405'; SCORM_LOG.push({el, len:s.length, ok:false}); return 'false'; }
      err='0'; store[el] = s; SCORM_LOG.push({el, len:s.length, ok:true}); return 'true';
    },
    LMSCommit: function () { return 'true'; },
    LMSFinish: function () { return 'true'; },
    LMSGetLastError: function () { return err; },
    LMSGetErrorString: function () { return ''; },
    LMSGetDiagnostic: function () { return ''; },
    _store: store
  };
})();

// Moodle laesst das iframe mit dem Inhalt wachsen; gescrollt wird aussen.
function fit() {
  const f = document.getElementById('sco');
  try { f.style.height = f.contentDocument.body.scrollHeight + 'px'; } catch (e) {}
}

const warte = ms => new Promise(r => setTimeout(r, ms));

window.runTests = async function () {
  const f = document.getElementById('sco');
  fit(); await warte(400);
  const g = f.contentWindow;
  const ergebnis = [];

  // Vollstaendiger Durchlauf wie ein SuS ihn macht
  g.eval(`
    pick('p1',0,'p1',PRED1,'p1fb'); pick('p2',1,'p2',PRED2,'p2fb');
    document.getElementById('r1').value='2,5';
    document.getElementById('r2').value='0,8';
    document.getElementById('r3').value='1,25';
    checkRead(); state.params=[0,1,2]; checkParams(); loadDemo(); go(5);
  `);
  fit(); await warte(400);

  // --- TEST 1: Ansicht springt beim Abschnittswechsel an den Anfang ---
  // Erst das iframe wirklich auf volle Hoehe bringen, sonst scrollt der Test ins Leere.
  for (let i = 0; i < 6; i++) { fit(); await warte(150); }
  // Dorthin scrollen, wo der Nutzer steht: zum Button "Zur Aufloesung" am Ende von Abschnitt 5.
  const btn = [...g.document.querySelectorAll('#sec5 .btn')].find(b => /Aufl/.test(b.textContent));
  const btnAbsolut = f.offsetTop + btn.offsetTop;      // Position im AEUSSEREN Dokument
  window.scrollTo(0, Math.max(0, btnAbsolut - window.innerHeight + 120));
  await warte(250);
  const scrollVor = Math.round(window.scrollY);
  g.eval("go(6);");
  fit(); await warte(500);
  const kopfSec6 = f.getBoundingClientRect().top + g.document.getElementById('sec6').offsetTop;
  ergebnis.push({
    test: 'Anfang von Abschnitt 6 ist nach dem Klick sichtbar',
    scrollVorKlick: scrollVor,
    scrollNachKlick: Math.round(window.scrollY),
    sec6ObenImFenster: Math.round(kopfSec6),
    aussagekraeftig: scrollVor > 800,
    bestanden: scrollVor > 800 && kopfSec6 > -80 && kopfSec6 < window.innerHeight
  });

  // --- TEST 2: Der gespeicherte Zustand passt in die SCORM-Grenzen ---
  g.eval("[0,1,2,3,4].forEach(i => answerQuiz(i, QUIZ[i].r)); finishModule();");
  await warte(300);
  const abgelehnt = SCORM_LOG.filter(c => !c.ok);
  const gespeichert = API._store['cmi.suspend_data'] || API._store['cmi.core.lesson_location'] || '';
  let wiederherstellbar = false;
  try { wiederherstellbar = !!JSON.parse(gespeichert).quiz; } catch (e) {}
  ergebnis.push({
    test: 'Zustand wird vollstaendig gespeichert und ist wieder lesbar',
    abgelehnteSchreibversuche: abgelehnt,
    laengeGespeichert: gespeichert.length,
    bestanden: abgelehnt.length === 0 && wiederherstellbar
  });

  window.TESTERGEBNIS = ergebnis;
  const kasten = document.getElementById('ergebnis');
  kasten.innerHTML = ergebnis.map(e =>
    '<p style="margin:.4rem 0"><strong style="color:' + (e.bestanden ? '#137333' : '#c5221f') + '">' +
    (e.bestanden ? 'BESTANDEN' : 'FEHLGESCHLAGEN') + '</strong> &middot; ' + e.test +
    '<br><code style="font-size:.85em;color:#555">' + JSON.stringify(e) + '</code></p>').join('');
  return ergebnis;
};
document.getElementById('sco').addEventListener('load', fit);
</script>
</body>
</html>
