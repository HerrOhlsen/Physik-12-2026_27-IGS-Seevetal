name: Build SCORM packages

on:
  push:
    branches: [main]
    paths:
      - "scorm-repo/src/**"
      - "scorm-repo/build.mjs"
      - "scorm-repo/modules.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build packages
        run: node build.mjs
        working-directory: scorm-repo

      - name: Commit rebuilt packages
        run: |
          if git diff --quiet -- scorm-repo/packages; then
            echo "Packages unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scorm-repo/packages
          git commit -m "Rebuild SCORM packages [skip ci]"
          git push
